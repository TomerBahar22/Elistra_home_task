services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [backend]

  flask-app:
    image: tomerbahar2/flask-containers:${FLASK_TAG:?FLASK_TAG is required}
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on: [socket-proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 10
    networks: [backend, frontend]

  nginx-proxy:
    image: tomerbahar2/nginx-proxy:${NGINX_TAG:?NGINX_TAG is required}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      flask-app:
        condition: service_healthy
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend: {}